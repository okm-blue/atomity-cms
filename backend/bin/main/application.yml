spring:
  application:
    name: atomity-cms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atomity_cms}
    username: ${SPRING_DATASOURCE_USERNAME:atomity}
    password: ${SPRING_DATASOURCE_PASSWORD:atomity}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}
cms:
  admin-email: ${ADMIN_EMAIL:admin@example.com}
  admin-password-hash: ${ADMIN_PASSWORD_HASH:}
  jwt-secret: ${JWT_SECRET:local-development-secret-change-this-before-production-1234}
  jwt-ttl: ${JWT_TTL:8h}
  media-storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
  public-base-url: ${CMS_PUBLIC_BASE_URL:http://localhost:8080}
