services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atomity_cms}
      POSTGRES_USER: ${POSTGRES_USER:-atomity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atomity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atomity} -d ${POSTGRES_DB:-atomity_cms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atomity_cms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atomity}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atomity}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-before-production-1234}
      JWT_TTL: ${JWT_TTL:-8h}
      SERVER_PORT: 8080
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/data/media}
      CMS_PUBLIC_BASE_URL: ${CMS_PUBLIC_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  mock-consumer:
    build:
      context: ./examples/mock-consumer
    environment:
      CMS_API_URL: http://backend:8080
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - demo

  mock-seed:
    build:
      context: ./examples/mock-consumer
    environment:
      CMS_API_URL: http://backend:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CONSUMER_PORT: 4000
    command: ["npm", "run", "seed"]
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - demo

  backend-test:
    build:
      context: ./backend
      target: test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - test

  frontend-check:
    build:
      context: ./frontend
      target: check
    profiles:
      - test

volumes:
  postgres-data:
  media-data:
